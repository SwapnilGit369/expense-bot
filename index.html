<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F172A">
  <title>SwapExp — Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* ===== ROOT & THEME ===== */
    :root {
      --primary: #6366F1;
      --primary-dark: #4F46E5;
      --primary-light: #818CF8;
      --secondary: #EC4899;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --bg: #0F172A;
      --bg-2: #1A202D;
      --bg-3: #252D3D;
      --card: #1A202D;
      --text: #F1F5F9;
      --text-2: #CBD5E1;
      --text-3: #94A3B8;
      --border: #334155;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* ===== RESET ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== APP LAYOUT ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 100;
    }

    .header-title {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
    }

    /* ===== PAGES ===== */
    .pages {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(80px + 16px);
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .page::-webkit-scrollbar {
      width: 4px;
    }

    .page::-webkit-scrollbar-track {
      background: transparent;
    }

    .page::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .page.active {
      display: block;
      opacity: 1;
    }

    /* ===== BOTTOM NAV ===== */
    .nav-bottom {
      height: 80px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(26, 32, 45, 0.8), rgba(26, 32, 45, 0.95));
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      position: sticky;
      bottom: 0;
      z-index: 100;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-3);
      font-size: 11px;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      border-radius: 12px;
      transition: all 0.3s ease;
      padding: 8px 4px;
    }

    .nav-item.active {
      color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .nav-icon {
      font-size: 24px;
      line-height: 1;
    }

    /* ===== CARDS ===== */
    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .card-sm {
      padding: 12px;
      border-radius: 16px;
    }

    /* ===== DASHBOARD ===== */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }

    .stat-sub {
      font-size: 10px;
      color: var(--text-3);
    }

    /* ===== CHART ===== */
    .chart-container {
      card: card;
      height: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chart-bars {
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      justify-content: space-between;
    }

    .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      border-radius: 6px 6px 0 0;
      position: relative;
      min-height: 4px;
      transition: all 0.3s ease;
    }

    .bar:hover {
      filter: brightness(1.2);
    }

    .bar-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--text-3);
      white-space: nowrap;
    }

    .bar-value {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
    }

    /* ===== TRANSACTIONS ===== */
    .txn-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .txn-item:last-child {
      border-bottom: none;
    }

    .txn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: rgba(99, 102, 241, 0.2);
    }

    .txn-content {
      flex: 1;
      min-width: 0;
    }

    .txn-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .txn-time {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .txn-amount {
      font-size: 14px;
      font-weight: 800;
      color: var(--danger);
      font-variant-numeric: tabular-nums;
    }

    /* ===== ADD EXPENSE FORM ===== */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: block;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .amount-input {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      padding: 14px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cat-btn {
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .cat-btn:active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
      transform: scale(0.95);
    }

    .cat-btn.selected {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(236, 72, 153, 0.15));
      border-color: var(--primary);
    }

    .cat-icon {
      font-size: 22px;
    }

    .cat-name {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-2);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: none;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-3);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-2);
    }

    .empty-sub {
      font-size: 12px;
      margin-top: 6px;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: linear-gradient(180deg, var(--card), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 20px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: calc(80px + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 300;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== SECTION TITLE ===== */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    /* ===== FILTER CHIPS ===== */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .chip.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-color: var(--primary);
      color: white;
    }
  </style>
</head>

<body>

  <div id="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-title">SwapExp</div>
      <div class="header-controls">
        <button class="icon-btn" onclick="openAccountsModal()">🏦</button>
        <button class="icon-btn" onclick="openCategoryModal()">➕</button>
      </div>
    </header>

    <!-- PAGES -->
    <div class="pages">

      <!-- DASHBOARD -->
      <div class="page active" id="page-home">
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-label">Today</div>
            <div class="stat-value">₹<span id="todayTotal">0</span></div>
            <div class="stat-sub" id="todayTxn">0 expenses</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">This Month</div>
            <div class="stat-value">₹<span id="monthTotal">0</span></div>
            <div class="stat-sub" id="monthTxn">0 expenses</div>
          </div>
        </div>

        <div class="chart-container card">
          <div class="chart-title">Last 10 Days</div>
          <div class="chart-bars" id="chartBars">
            <div style="text-align:center;width:100%;color:var(--text-3);font-size:12px">Loading...</div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">Recent Transactions</div>
          <div id="recentTxns"></div>
        </div>
      </div>

      <!-- ADD EXPENSE -->
      <div class="page" id="page-add">
        <div class="card">
          <div class="form-group">
            <input type="number" class="input-field amount-input" id="amountInput" placeholder="0" inputmode="decimal">
          </div>

          <div class="form-group">
            <label class="form-label">Category</label>
            <div class="cat-grid" id="catGrid"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Account</label>
            <select class="input-field" id="accountSelect"></select>
          </div>

          <div class="form-group">
            <label class="form-label">Description</label>
            <input type="text" class="input-field" id="descInput" placeholder="What did you spend on?">
          </div>

          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" class="input-field" id="dateInput">
          </div>

          <button class="btn-primary" onclick="addExpense()">Add Expense</button>
        </div>
      </div>

      <!-- EXPENSES LIST -->
      <div class="page" id="page-expenses">
        <div class="filter-chips">
          <button class="chip active" onclick="filterExp('month', this)">This Month</button>
          <button class="chip" onclick="filterExp('week', this)">This Week</button>
          <button class="chip" onclick="filterExp('today', this)">Today</button>
        </div>
        <div id="expList"></div>
      </div>

      <!-- REPORTS -->
      <div class="page" id="page-reports">
        <div class="card">
          <div class="section-title">Category Breakdown</div>
          <div id="catBreakdown"></div>
        </div>
        <div class="card">
          <div class="section-title">Account Summary</div>
          <div id="accSummary"></div>
        </div>
      </div>

      <!-- SETTINGS -->
      <div class="page" id="page-settings">
        <div class="card">
          <div style="font-size:14px;font-weight:700;margin-bottom:14px">Accounts</div>
          <div id="accList"></div>
        </div>
        <div class="card">
          <div style="font-size:14px;font-weight:700;margin-bottom:14px">Categories</div>
          <div id="catList"></div>
        </div>
      </div>

    </div>

    <!-- BOTTOM NAV -->
    <nav class="nav-bottom">
      <button class="nav-item active" onclick="switchPage('home', this)">
        <span class="nav-icon">📊</span><span>Home</span>
      </button>
      <button class="nav-item" onclick="switchPage('add', this)">
        <span class="nav-icon">➕</span><span>Add</span>
      </button>
      <button class="nav-item" onclick="switchPage('expenses', this)">
        <span class="nav-icon">💸</span><span>List</span>
      </button>
      <button class="nav-item" onclick="switchPage('reports', this)">
        <span class="nav-icon">📈</span><span>Reports</span>
      </button>
      <button class="nav-item" onclick="switchPage('settings', this)">
        <span class="nav-icon">⚙️</span><span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- MODALS -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // CONFIG
    const SUPABASE_URL = "https://jllnfocnsvgnqdmzrnue.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsbG5mb2Nuc3ZnbnFkbXpybnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NDIxOTUsImV4cCI6MjEwMDUxODE5NX0.ofUuGFvzfMKWLRN72DV_Y5Q7vbbxts44wvU_zCkmBiY";
    const PYTHONANYWHERE_URL = 'https://swapnilpy369.pythonanywhere.com';

    // STATE
    let state = {
      expenses: [],
      categories: [],
      accounts: [],
      selectedCat: null,
      selectedAcc: null,
      filterType: 'month'
    };

    const CAT_ICONS = {
      'Food': '🍔', 'Fuel': '⛽', 'Kirana': '🛒', 'Clothes': '👕', 'Medical': '💊', 'Bills': '⚡', 'Entertainment': '🎬', 'Transport': '🚕', 'Utilities': '💡', 'Other': '📦'
    };

    // SUPABASE
    const SB = {
      h: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      async get(t, p = '') { return (await fetch(`${SUPABASE_URL}/rest/v1/${t}?${p}`, { headers: this.h })).json(); },
      async post(t, d) { return (await fetch(`${SUPABASE_URL}/rest/v1/${t}`, { method: 'POST', headers: this.h, body: JSON.stringify(d) })).json(); },
      async patch(t, id, d) { return (await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`, { method: 'PATCH', headers: this.h, body: JSON.stringify(d) })).json(); },
      async del(t, id) { return (await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`, { method: 'DELETE', headers: this.h })).status; }
    };

    // LOAD DATA
    async function loadAll() {
      try {
        const [cats, accs, exps] = await Promise.all([
          SB.get('categories', 'select=*&order=name'),
          SB.get('accounts', 'select=*&order=created_at'),
          SB.get('expenses', 'select=*,categories(name),accounts(name)&order=date.desc,created_at.desc&limit=500')
        ]);
        state.categories = Array.isArray(cats) ? cats : [];
        state.accounts = Array.isArray(accs) ? accs : [];
        state.expenses = Array.isArray(exps) ? exps : [];
        if (state.accounts.length > 0) state.selectedAcc = state.accounts[0].id;
        renderAll();
      } catch (e) { toast('Error loading data'); }
    }

    // RENDER
    function renderAll() {
      renderHome();
      renderCatGrid();
      renderAccountSelect();
      renderExpList();
      renderReports();
      renderSettings();
    }

    function renderHome() {
      const now = new Date();
      const today = now.toISOString().split('T')[0];
      const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;

      const todayExp = state.expenses.filter(e => e.date === today);
      const monthExp = state.expenses.filter(e => e.date >= monthStart);
      const todayAmt = todayExp.reduce((s, e) => s + parseFloat(e.amount), 0);
      const monthAmt = monthExp.reduce((s, e) => s + parseFloat(e.amount), 0);

      document.getElementById('todayTotal').textContent = fmtNum(todayAmt);
      document.getElementById('todayTxn').textContent = `${todayExp.length} expense${todayExp.length !== 1 ? 's' : ''}`;
      document.getElementById('monthTotal').textContent = fmtNum(monthAmt);
      document.getElementById('monthTxn').textContent = `${monthExp.length} expense${monthExp.length !== 1 ? 's' : ''}`;

      // Chart
      const last10 = [];
      for (let i = 9; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        const ds = d.toISOString().split('T')[0];
        const amt = state.expenses.filter(e => e.date === ds).reduce((s, e) => s + parseFloat(e.amount), 0);
        last10.push({ date: ds, amt });
      }
      const maxAmt = Math.max(...last10.map(x => x.amt), 1);
      const bars = last10.map(x => {
        const h = (x.amt / maxAmt) * 100;
        const d = new Date(x.date);
        return `<div class="bar" style="height:${Math.max(h, 5)}%"><div class="bar-value">${fmtNumShort(x.amt)}</div><div class="bar-label">${d.getDate()}</div></div>`;
      }).join('');
      document.getElementById('chartBars').innerHTML = bars;

      // Recent
      const recent = state.expenses.slice(0, 5);
      const html = recent.length ? recent.map(e => `
    <div class="txn-item">
      <div class="txn-icon">${CAT_ICONS[e.categories?.name] || '📦'}</div>
      <div class="txn-content">
        <div class="txn-name">${e.description || e.categories?.name}</div>
        <div class="txn-time">${fmtDate(e.date)} • ${e.accounts?.name}</div>
      </div>
      <div class="txn-amount">-₹${fmtNum(e.amount)}</div>
    </div>`).join('') : '<div class="empty-state"><div class="empty-icon">💸</div><div class="empty-text">No expenses yet</div></div>';
      document.getElementById('recentTxns').innerHTML = html;
    }

    function renderCatGrid() {
      const grid = document.getElementById('catGrid');
      grid.innerHTML = state.categories.map(c => `
    <button class="cat-btn ${state.selectedCat === c.id ? 'selected' : ''}" onclick="selectCat(${c.id})">
      <span class="cat-icon">${CAT_ICONS[c.name] || '📦'}</span>
      <span class="cat-name">${c.name}</span>
    </button>`).join('');
    }

    function renderAccountSelect() {
      const sel = document.getElementById('accountSelect');
      sel.innerHTML = state.accounts.map(a => `<option value="${a.id}">${a.name} (${a.type})</option>`).join('');
      if (state.selectedAcc) sel.value = state.selectedAcc;
    }

    function renderExpList() {
      const now = new Date();
      const today = now.toISOString().split('T')[0];
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;

      let list = state.expenses;
      if (state.filterType === 'today') list = list.filter(e => e.date === today);
      else if (state.filterType === 'week') list = list.filter(e => e.date >= weekAgo);
      else list = list.filter(e => e.date >= monthStart);

      const html = list.length ? list.map(e => `
    <div class="card card-sm">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">
          <span style="font-size:18px">${CAT_ICONS[e.categories?.name] || '📦'}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.description || e.categories?.name}</div>
            <div style="font-size:11px;color:var(--text-3);margin-top:2px">${fmtDate(e.date)} • ${e.accounts?.name}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:15px;font-weight:800;color:var(--danger)">-₹${fmtNum(e.amount)}</div>
          <button class="icon-btn" style="width:28px;height:28px;font-size:12px;margin-top:4px" onclick="delExp(${e.id})">🗑️</button>
        </div>
      </div>
    </div>`).join('') : '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No expenses</div></div>';
      document.getElementById('expList').innerHTML = html;
    }

    function renderReports() {
      const now = new Date();
      const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      const monthExp = state.expenses.filter(e => e.date >= monthStart);

      // Category breakdown
      const catMap = {};
      monthExp.forEach(e => {
        const c = e.categories?.name || 'Other';
        catMap[c] = (catMap[c] || 0) + parseFloat(e.amount);
      });
      const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
      const catHtml = cats.map(([cat, amt]) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;gap:8px;align-items:center;flex:1">
        <span>${CAT_ICONS[cat] || '📦'}</span>
        <span style="font-size:13px">${cat}</span>
      </div>
      <div style="text-align:right">
        <div style="font-size:14px;font-weight:700">₹${fmtNum(amt)}</div>
        <div style="font-size:10px;color:var(--text-3)">${Math.round((amt / monthExp.reduce((s, e) => s + parseFloat(e.amount), 0)) * 100)}%</div>
      </div>
    </div>`).join('');
      document.getElementById('catBreakdown').innerHTML = catHtml || '<div class="empty-state"><div class="empty-text">No data</div></div>';

      // Account summary
      const accMap = {};
      monthExp.forEach(e => {
        const a = e.accounts?.name || 'Unknown';
        accMap[a] = (accMap[a] || 0) + parseFloat(e.amount);
      });
      const accHtml = Object.entries(accMap).map(([acc, amt]) => `
    <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:13px">🏦 ${acc}</span>
      <span style="font-size:14px;font-weight:700">₹${fmtNum(amt)}</span>
    </div>`).join('');
      document.getElementById('accSummary').innerHTML = accHtml || '<div class="empty-state"><div class="empty-text">No data</div></div>';
    }

    function renderSettings() {
      const accHtml = state.accounts.map(a => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:13px;font-weight:600">🏦 ${a.name}</div>
        <div style="font-size:11px;color:var(--text-3);margin-top:2px">${a.type} • Opening: ₹${fmtNum(a.opening_balance)}</div>
      </div>
      <button class="icon-btn" style="width:28px;height:28px;font-size:12px" onclick="delAccount(${a.id})">🗑️</button>
    </div>`).join('');
      document.getElementById('accList').innerHTML = accHtml || '<div style="color:var(--text-3);font-size:13px">No accounts</div>';

      const catHtml = state.categories.map(c => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;gap:8px;align-items:center">
        <span>${CAT_ICONS[c.name] || '📦'}</span>
        <span style="font-size:13px">${c.name}</span>
      </div>
      <button class="icon-btn" style="width:28px;height:28px;font-size:12px" onclick="delCategory(${c.id})">🗑️</button>
    </div>`).join('');
      document.getElementById('catList').innerHTML = catHtml || '<div style="color:var(--text-3);font-size:13px">No categories</div>';
    }

    // ACTIONS
    function selectCat(id) {
      state.selectedCat = state.selectedCat === id ? null : id;
      renderCatGrid();
    }

    async function addExpense() {
      const amt = parseFloat(document.getElementById('amountInput').value);
      const desc = document.getElementById('descInput').value;
      const date = document.getElementById('dateInput').value || new Date().toISOString().split('T')[0];
      const accId = parseInt(document.getElementById('accountSelect').value);
      if (!amt || amt <= 0) { toast('Enter amount'); return; }
      if (!state.selectedCat) { toast('Select category'); return; }
      try {
        const result = await SB.post('expenses', { amount: amt, category_id: state.selectedCat, description: desc, date, account_id: accId, source: 'mobile' });
        if (Array.isArray(result) && result.length > 0) {
          const cat = state.categories.find(c => c.id === state.selectedCat);
          const acc = state.accounts.find(a => a.id === accId);
          result[0].categories = { name: cat?.name || 'Other' };
          result[0].accounts = { name: acc?.name || 'Unknown' };
          state.expenses.unshift(result[0]);
          document.getElementById('amountInput').value = '';
          document.getElementById('descInput').value = '';
          state.selectedCat = null;
          renderAll();
          toast('Expense added! ✓');
          switchPage('home', document.querySelector('.nav-item'));
        }
      } catch (e) { toast('Error'); }
    }

    async function delExp(id) {
      if (!confirm('Delete?')) return;
      await SB.del('expenses', id);
      state.expenses = state.expenses.filter(e => e.id !== id);
      renderAll();
      toast('Deleted!');
    }

    function openAccountsModal() {
      const html = `
    <div class="form-group">
      <label class="form-label">Account Name</label>
      <input type="text" class="input-field" id="accName" placeholder="e.g., HDFC Bank">
    </div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <select class="input-field" id="accType">
        <option value="bank">Bank</option>
        <option value="cash">Cash</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Opening Balance</label>
      <input type="number" class="input-field" id="accBalance" placeholder="0">
    </div>
    <button class="btn-primary" onclick="saveAccount()">Create Account</button>`;
      openModal('New Account', html);
    }

    async function saveAccount() {
      const name = document.getElementById('accName').value.trim();
      const type = document.getElementById('accType').value;
      const bal = parseFloat(document.getElementById('accBalance').value) || 0;
      if (!name) { toast('Enter name'); return; }
      const result = await SB.post('accounts', { name, type, opening_balance: bal, current_month: new Date().getMonth() + 1, current_year: new Date().getFullYear() });
      if (Array.isArray(result) && result.length > 0) {
        state.accounts.push(result[0]);
        renderAll();
        closeModal();
        toast('Account created! ✓');
      }
    }

    async function delAccount(id) {
      if (!confirm('Delete account?')) return;
      await SB.del('accounts', id);
      state.accounts = state.accounts.filter(a => a.id !== id);
      renderAll();
      toast('Deleted!');
    }

    function openCategoryModal() {
      const html = `
    <div class="form-group">
      <label class="form-label">Category Name</label>
      <input type="text" class="input-field" id="catName" placeholder="e.g., Shopping">
    </div>
    <button class="btn-primary" onclick="saveCategory()">Add Category</button>`;
      openModal('New Category', html);
    }

    async function saveCategory() {
      const name = document.getElementById('catName').value.trim();
      if (!name) { toast('Enter name'); return; }
      const result = await SB.post('categories', { name });
      if (Array.isArray(result) && result.length > 0) {
        state.categories.push(result[0]);
        renderAll();
        closeModal();
        toast('Category added! ✓');
      }
    }

    async function delCategory(id) {
      if (!confirm('Delete category?')) return;
      await SB.del('categories', id);
      state.categories = state.categories.filter(c => c.id !== id);
      renderAll();
      toast('Deleted!');
    }

    // UI
    function switchPage(page, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${page}`).classList.add('active');
      btn.classList.add('active');
    }

    function filterExp(type, btn) {
      state.filterType = type;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderExpList();
    }

    function openModal(title, body) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay')) return;
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // HELPERS
    function fmtNum(n) {
      const num = parseFloat(n) || 0;
      if (num >= 100000) return (num / 100000).toFixed(1) + 'L';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return Math.round(num).toLocaleString('en-IN');
    }

    function fmtNumShort(n) {
      const num = parseFloat(n) || 0;
      if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
      return Math.round(num).toString();
    }

    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    // INIT
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    loadAll();
  </script>
</body>

</html>
